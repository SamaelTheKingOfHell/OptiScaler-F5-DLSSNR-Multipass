name: Multi-GPU submission protocol checks

on:
  push:
    paths:
      - 'OptiScaler/dlssnr/DlssNr_CrossAdapterProtocol.h'
      - 'tests/nr_cross_adapter_protocol_smoke.cpp'
      - '.github/workflows/multigpu_protocol.yml'
  pull_request:
    paths:
      - 'OptiScaler/dlssnr/DlssNr_CrossAdapterProtocol.h'
      - 'tests/nr_cross_adapter_protocol_smoke.cpp'
      - '.github/workflows/multigpu_protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run protocol failure cases
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools are required.' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          & cmd /d /c "`"$vcvars`" >nul && cl /nologo /std:c++17 /EHsc /W4 /WX tests/nr_cross_adapter_protocol_smoke.cpp /Fe:`"$env:RUNNER_TEMP/nr_cross_adapter_protocol_smoke.exe`" /Fo:`"$env:RUNNER_TEMP/nr_cross_adapter_protocol_smoke.obj`""
          if ($LASTEXITCODE -ne 0) { throw 'Protocol test compilation failed.' }
          & "$env:RUNNER_TEMP/nr_cross_adapter_protocol_smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Protocol test failed.' }
